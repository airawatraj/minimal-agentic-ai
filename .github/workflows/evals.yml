name: Deterministic Agent Evals

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  evals:
    name: Run Golden Evaluation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync Dependencies
        run: uv sync

      - name: Run Deterministic Evals
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'http://192.168.20.91:8000/v1' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'none' }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'Cogni-Brain' }}
        run: uv run python src/eval_agent.py
