name: Deterministic Agent Evals

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  evals:
    name: Run Golden Evaluation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync Dependencies
        run: uv sync

      - name: Run Configuration & Parity Audit
        run: uv run python tests/test_config_audit.py

      - name: Run Deterministic Evals
        env:
          COGNI_BASE_URL: ${{ secrets.COGNI_BASE_URL || 'http://localhost:8000/v1' }}
          COGNI_API_KEY: ${{ secrets.COGNI_API_KEY || 'none' }}
          COGNI_MODEL: ${{ secrets.COGNI_MODEL || 'Cogni-Brain' }}
          MOCK_EVAL: ${{ secrets.COGNI_BASE_URL != '' && '0' || '1' }}
        run: uv run python src/eval_agent.py


