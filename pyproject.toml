[project]
name = "minimal-agentic-ai"
version = "0.1.0"
description = "Minimalist, first-principles AI agents using bare-metal loops, typed graphs, and deterministic guardrails."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

